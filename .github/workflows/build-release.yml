name: Build Idea Recorder 1.0.0

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Android APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Build Harmony compatibility APKs
        working-directory: harmony-compat
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Idea-Recorder-1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Idea-Recorder-1.0.0-release.apk
          cp harmony-compat/app/build/outputs/apk/debug/app-debug.apk dist/Idea-Recorder-Harmony-1.0.0-debug.apk
          cp harmony-compat/app/build/outputs/apk/release/app-release.apk dist/Idea-Recorder-Harmony-1.0.0-release.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Idea-Recorder-1.0.0-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Idea Recorder 1.0.0
          body_path: RELEASE_NOTES_1.0.0.md
          files: dist/*.apk
